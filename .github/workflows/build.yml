name: Build

# Two trigger conditions (Phase 7 checkpoint):
# - Every push to main: build all three OSes and upload as workflow
#   artifacts only. Catches packaging breakage early, at the point a
#   change causes it, rather than only discovering it at release time.
# - Pushing a `v*` tag: same build, plus attach the artifacts to a
#   GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: MushTato-windows
          - os: ubuntu-latest
            artifact_name: MushTato-linux
          - os: macos-latest
            artifact_name: MushTato-macos
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned to these specific majors (not v4/v5) because they're the
      # first ones that actually default to Node 24 rather than just
      # having "preliminary" support while still defaulting to Node 20
      # (which GitHub is retiring during 2026 -- see
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Since Qt 6.5, the xcb platform plugin requires libxcb-cursor0
      # to load at all -- without it, the app aborts on launch with
      # "no Qt platform plugin could be initialized" on any real X11
      # desktop. PyInstaller can only bundle a shared library if it's
      # present on the *build* machine, so it has to be installed here,
      # not just documented as a user-side requirement -- ubuntu-latest
      # is a minimal image and doesn't have it (or its usual xcb
      # companions) by default. The rest of this list is the standard
      # set PySide6/PyQt6 deployment guides call out for headless/
      # minimal Ubuntu builds, installed proactively rather than
      # waiting to discover each one missing via a separate crash
      # report on some other user's desktop/window-manager combo.
      - name: Install Linux Qt/xcb runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Build with PyInstaller
        run: pyinstaller packaging/mushtato.spec --noconfirm

      # macOS ships a .app bundle; regular zip mangles bundle
      # permissions/symlinks, so use Apple's own `ditto` there instead
      # of a generic archiver. --onedir (this project's spec, not
      # --onefile) is more reliable for PySide6's Qt-plugin discovery
      # than a single-file build, at the cost of shipping a folder.
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a ../${{ matrix.artifact_name }}.zip MushTato
      - name: Package artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar czf ../${{ matrix.artifact_name }}.tar.gz MushTato
      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent MushTato ../${{ matrix.artifact_name }}.zip

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.zip
            ${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: ignore
          # This repo is private, so Actions artifact storage is capped
          # at 500MB total (GitHub's free-tier quota) -- with no
          # retention set, artifacts default to 90 days and, at this
          # project's push frequency (3 OS builds uploaded per push to
          # main), that quota gets blown through in days, not months
          # (hit directly: 105 accumulated artifacts, 5.58GB, well past
          # the cap, on 2026-07-28). 7 days matches how these are
          # actually used -- catching a packaging break shortly after
          # a push, not kept as a long-term archive. Doesn't affect the
          # tag-triggered release job below: it downloads and attaches
          # these to the GitHub Release within the same workflow run,
          # minutes after upload, long before any expiry would apply.
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
